name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build
        run: |
          echo "Dateien im Repository:"
          find . -not -path './.git/*' -not -path './.git' | head -n 80
          SG=$(grep -rl "duel-analyzer" --include=settings.gradle . | head -n 1)
          if [ -z "$SG" ]; then
            echo "FEHLER: Das Projekt duel-analyzer wurde im Repository nicht gefunden"
            exit 1
          fi
          cd "$(dirname "$SG")"
          gradle build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: duel-analyzer
          path: "**/build/libs/*.jar"
